<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>점심 빠칭코 추천</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>점심 메뉴 빠칭코</h1>
      <p class="sub">버튼을 누르면 랜덤 맛집이 빠칭코처럼 돌아가며 멈춥니다.</p>
      <p class="source">데이터 소스: {{ source }}</p>
      <p class="notice">{{ notice }}</p>

      <section class="machine">
        <div class="pointer"></div>
        <div class="window">
          <div id="reel" class="reel"></div>
        </div>
      </section>

      <button id="spinBtn" class="spin-btn">추천 시작</button>

      <section id="resultCard" class="result hidden">
        <h2 id="resultName"></h2>
        <p id="resultMeta"></p>
      </section>
    </main>

    <script>
      window.RESTAURANTS = {{ restaurants|tojson }};
    </script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
